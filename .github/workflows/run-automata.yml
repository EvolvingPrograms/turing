name: Run automata
run-name: "[${{ inputs.model }}] automata rule=${{ inputs.rule }} steps=${{ inputs.steps }} n=${{ inputs.n }}"

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model slug"
        required: false
        default: "anthropic/claude-opus-4.6"
        type: string
      rule:
        description: "Rule number(s), comma-separated (e.g. 110 or 30,90,110). Blank = full 256-rule sweep."
        required: false
        default: ""
        type: string
      steps:
        description: "Generations per test"
        required: false
        default: "9"
        type: string
      n:
        description: "Trials per rule (each trial gets a fresh random tape)"
        required: false
        default: "1"
        type: string
      batch:
        description: "Tests run in parallel"
        required: false
        default: "1"
        type: string
      debug:
        description: "Write train.txt and tests.jsonl"
        required: false
        default: false
        type: boolean

jobs:
  run:
    name: automata rule=${{ inputs.rule }} steps=${{ inputs.steps }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: packages-${{ hashFiles('**/bun.lockb') }}
          restore-keys: packages-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bun programs/automata \
            ${{ inputs.model }} \
            ${{ inputs.rule && format('--rule={0}', inputs.rule) || '' }} \
            --steps=${{ inputs.steps }} \
            --n=${{ inputs.n }} \
            --batch=${{ inputs.batch }} \
            ${{ inputs.debug && '--debug' || '' }}
