name: Run arithmetic-cross-slide

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model slug"
        required: false
        default: "anthropic/claude-opus-4.6"
        type: string
      digits_a:
        description: "Digit count for operand A"
        required: true
        default: "128"
        type: string
      digits_b:
        description: "Digit count for operand B"
        required: true
        default: "128"
        type: string
      chunk:
        description: "Cell size (base-10^chunk); 1..6"
        required: false
        default: "2"
        type: string
      n:
        description: "Number of tests to run"
        required: false
        default: "1"
        type: string
      batch:
        description: "Tests run in parallel"
        required: false
        default: "1"
        type: string
      from:
        description: "Warm-start at row k (skips ramp-up). Blank = full run."
        required: false
        default: ""
        type: string
      debug:
        description: "Write train.txt and tests.jsonl"
        required: false
        default: false
        type: boolean

jobs:
  run:
    name: cross-slide ${{ inputs.digits_a }}x${{ inputs.digits_b }} chunk=${{ inputs.chunk }}${{ inputs.from && format(' from=k{0}', inputs.from) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: packages-${{ hashFiles('**/bun.lockb') }}
          restore-keys: packages-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          bun programs/arithmetic-2026-cross-slide \
            ${{ inputs.model }} \
            ${{ inputs.digits_a }} ${{ inputs.digits_b }} \
            --chunk=${{ inputs.chunk }} \
            --n=${{ inputs.n }} \
            --batch=${{ inputs.batch }} \
            ${{ inputs.from && format('--from={0}', inputs.from) || '' }} \
            ${{ inputs.debug && '--debug' || '' }}
